<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login System</title>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="../bootstrap.min.css" />
  </head>
  <body data-bs-theme="dark">
    <nav class="navbar navbar-expand-lg bg-body-tertiary py-3 fixed-top">
      <div class="container">
        <a class="navbar-brand text-uppercase" href="#">Smart Login</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarBtn"
          aria-controls="navbarBtn"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse mt-3 mt-lg-0" id="navbarBtn">
          <div class="row w-100 ms-0">
            <button
              class="logoutBtn d-flex justify-content-center btn btn-lg btn-outline-info col-lg-1 ms-lg-auto"
            >
              Logout
            </button>
          </div>
        </div>
      </div>
    </nav>

    <div
      class="conatiner vh-100 d-flex justify-content-center align-items-center"
    >
      <div class="shadow-lg text-center p-5">
        <p class="text-info text-capitalize" style="font-size: 50px">
          Welcome <span class="loggedInUserName"></span>
        </p>
      </div>
    </div>

    <!-- Bootstrap -->
    <script src="../js/bootstrap.bundle.min.js"></script>
    <!-- Main Page JS -->
    <script src="../js/main.js"></script>
  </body>
</html>
